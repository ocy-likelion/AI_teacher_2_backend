spring:
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    active: dev
    include: secret

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: false
      jdbc.time_zone: Asia/Seoul
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

logging:
  level:
    root: INFO
    com.ll.ilta: DEBUG

ai:
  service:
    url: ${AI_SERVICE_URL}

supabase:
  url: ${SUPABASE_URL}
  image-base-url: ${SUPABASE_IMAGE_BASE_URL}
  secret-key: ${SUPABASE_SECRET_KEY}
  bucket: "ilta-images"

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS}
